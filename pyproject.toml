[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "session-doc"
version = "0.0.1"
description = "Turn coding-agent session logs into searchable HTML docs."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/punchman340/session-doc"
Issues = "https://github.com/punchman340/session-doc/issues"

[project.scripts]
session-doc = "session_doc.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

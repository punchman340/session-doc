[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "session-doc"
version = "0.0.1"
description = "Turn coding-agent session logs into searchable HTML docs."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/session_doc/assets/minisearch.LICENSE.txt"]
authors = [{ name = "punchman340" }]
requires-python = ">=3.10"
dependencies = [
    "jinja2>=3.1.6",
    "markdown-it-py>=4.2.0",
]
keywords = ["claude-code", "coding-agent", "session-log", "jsonl", "static-site", "search"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: Text Processing :: Markup :: HTML",
]

[project.urls]
Homepage = "https://github.com/punchman340/session-doc"
Issues = "https://github.com/punchman340/session-doc/issues"

[project.scripts]
session-doc = "session_doc.cli:main"

[dependency-groups]
dev = ["pytest>=9.2", "ruff>=0.17.3"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

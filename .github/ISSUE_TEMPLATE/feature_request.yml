name: Feature request
description: Suggest a change or a new feature
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        ## Do not paste real session logs
        Session logs (JSONL) can contain secrets, tokens, file paths, and private code.
        If an example helps, use a minimal, anonymized snippet.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should session-doc do instead?
    validations:
      required: true
